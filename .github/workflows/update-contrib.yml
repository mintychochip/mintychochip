name: Update GitHub Contribution Graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate contribution SVG
        run: node header/build-contrib.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/readme-contrib.svg
          if git diff --staged --quiet; then
            echo "No changes in contribution graph"
          else
            git commit -m "Update GitHub contribution graph [skip ci]"
            git push
          fi
